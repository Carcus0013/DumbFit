<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Fitness - Login & Register</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff6b6b;
            --secondary: #4ecdc4;
            --dark: #292f36;
            --light: #f7fff7;
            --accent: #ff9f1c;
            --error: #ff4757;
            --success: #2ed573;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #292f36 0%, #1a1e23 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        
        .bg-bubbles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        .bg-bubbles li {
            position: absolute;
            list-style: none;
            display: block;
            width: 40px;
            height: 40px;
            background-color: rgba(255, 255, 255, 0.15);
            bottom: -160px;
            animation: square 25s infinite;
            transition-timing-function: linear;
            border-radius: 2px;
        }
        
        @keyframes square {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-1000px) rotate(720deg);
                opacity: 0;
            }
        }
        
        .container {
            position: relative;
            z-index: 2;
            width: 550px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            transition: all 0.5s ease;
            transform: translateY(20px);
            opacity: 0;
            animation: fadeInUp 0.8s forwards 0.3s;
        }
        
        @keyframes fadeInUp {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        .container:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.3);
        }
        
        .form-container {
            padding: 40px;
            width: 100%;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
            transform: scale(0.9);
            animation: scaleIn 0.8s forwards 0.5s;
        }
        
        @keyframes scaleIn {
            to {
                transform: scale(1);
            }
        }
        
        .logo i {
            font-size: 50px;
            color: var(--accent);
            margin-bottom: 10px;
            display: inline-block;
            animation: bounce 2s infinite;
        }
        
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-20px);
            }
            60% {
                transform: translateY(-10px);
            }
        }
        
        .logo h2 {
            color: var(--light);
            font-weight: 600;
            font-size: 28px;
            letter-spacing: 1px;
        }
        
        .input-group {
            position: relative;
            margin-bottom: 25px;
        }
        
        .input-group input {
            width: 100%;
            padding: 15px 20px 15px 45px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            color: var(--light);
            font-size: 16px;
            transition: all 0.3s ease;
        }
        
        .input-group input:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 10px rgba(255, 159, 28, 0.3);
        }
        
        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }
        
        .input-group i {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.8);
            font-size: 18px;
            transition: all 0.3s ease;
        }
        
        .input-group input:focus + i {
            color: var(--accent);
            transform: translateY(-50%) scale(1.1);
        }
        
        .btn {
            width: 100%;
            padding: 15px;
            background: var(--accent);
            color: var(--dark);
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            position: relative;
            overflow: hidden;
        }
        
        .btn:hover {
            background: #ff8c00;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 159, 28, 0.4);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn:after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 5px;
            height: 5px;
            background: rgba(255, 255, 255, 0.5);
            opacity: 0;
            border-radius: 100%;
            transform: scale(1, 1) translate(-50%);
            transform-origin: 50% 50%;
        }
        
        .btn:focus:not(:active)::after {
            animation: ripple 1s ease-out;
        }
        
        @keyframes ripple {
            0% {
                transform: scale(0, 0);
                opacity: 0.5;
            }
            100% {
                transform: scale(20, 20);
                opacity: 0;
            }
        }
        
        .toggle-form {
            text-align: center;
            margin-top: 25px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
        }
        
        .toggle-form a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }
        
        .toggle-form a:hover {
            text-decoration: underline;
        }
        
        .toggle-form a:after {
            content: '';
            position: absolute;
            width: 100%;
            transform: scaleX(0);
            height: 2px;
            bottom: -2px;
            left: 0;
            background-color: var(--accent);
            transform-origin: bottom right;
            transition: transform 0.25s ease-out;
        }
        
        .toggle-form a:hover:after {
            transform: scaleX(1);
            transform-origin: bottom left;
        }
        
        .social-login {
            display: flex;
            justify-content: center;
            margin-top: 30px;
        }
        
        .social-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 10px;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .social-btn:before {
            content: '';
            position: absolute;
            width: 120%;
            height: 120%;
            background: linear-gradient(#fff, transparent);
            transform: rotate(45deg) translate(-20%, -100%);
            transition: all 0.3s;
        }
        
        .social-btn:hover:before {
            transform: rotate(45deg) translate(20%, 100%);
        }
        
        .social-btn:hover {
            background: var(--accent);
            transform: translateY(-3px);
            color: var(--dark);
            box-shadow: 0 5px 15px rgba(255, 159, 28, 0.3);
        }
        
        #registerContainer {
            display: none;
        }
        
        .password-strength {
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            margin-top: 5px;
            overflow: hidden;
        }
        
        .strength-bar {
            height: 100%;
            width: 0%;
            transition: all 0.3s ease;
        }
        
        .terms {
            display: flex;
            align-items: center;
            margin: 15px 0;
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
        }
        
        .terms input {
            margin-right: 10px;
            cursor: pointer;
        }
        
        .validation-message {
            color: var(--error);
            font-size: 12px;
            margin-top: 5px;
            margin-left: 15px;
            height: 0;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        
        .validation-message.show {
            height: 18px;
        }
        
        .validation-message.valid {
            color: var(--success);
        }
        
        /* Animated background bubbles */
        li:nth-child(1) {
            left: 10%;
            animation-delay: 0s;
        }
        
        li:nth-child(2) {
            left: 20%;
            width: 80px;
            height: 80px;
            animation-delay: 2s;
            animation-duration: 17s;
        }
        
        li:nth-child(3) {
            left: 25%;
            animation-delay: 4s;
        }
        
        li:nth-child(4) {
            left: 40%;
            width: 60px;
            height: 60px;
            animation-duration: 22s;
            background-color: rgba(255, 255, 255, 0.25);
        }
        
        li:nth-child(5) {
            left: 70%;
        }
        
        li:nth-child(6) {
            left: 80%;
            width: 120px;
            height: 120px;
            animation-delay: 3s;
            background-color: rgba(255, 255, 255, 0.2);
        }
        
        li:nth-child(7) {
            left: 32%;
            width: 160px;
            height: 160px;
            animation-delay: 7s;
        }
        
        li:nth-child(8) {
            left: 55%;
            width: 20px;
            height: 20px;
            animation-delay: 15s;
            animation-duration: 40s;
        }
        
        li:nth-child(9) {
            left: 25%;
            width: 10px;
            height: 10px;
            animation-delay: 2s;
            animation-duration: 40s;
            background-color: rgba(255, 255, 255, 0.3);
        }
        
        li:nth-child(10) {
            left: 90%;
            width: 160px;
            height: 160px;
            animation-delay: 11s;
        }
        
        /* Toast notification */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px 25px;
            border-radius: 5px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transform: translateX(200%);
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1000;
            max-width: 300px;
        }
        
        .toast.show {
            transform: translateX(0);
        }
        
        .toast.success {
            border-left: 4px solid var(--success);
        }
        
        .toast.error {
            border-left: 4px solid var(--error);
        }
        
        .toast i {
            margin-right: 10px;
        }
        
        /* Pulse animation */
        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
            100% {
                transform: scale(1);
            }
        }
        
        .pulse {
            animation: pulse 2s infinite;
        }
    </style>
</head>
<body>
    <ul class="bg-bubbles">
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
    </ul>

    <div id="toast" class="toast"></div>

    <div class="container">
        <div class="form-container" id="loginContainer">
            <div class="logo">
                <i class="fas fa-dumbbell"></i>
                <h2>DUMBFIT</h2>
            </div>
            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input type="email" id="loginEmail" placeholder="Email" required>
                <div class="validation-message" id="loginEmailError"></div>
            </div>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="loginPassword" placeholder="Password" required>
                <div class="validation-message" id="loginPasswordError"></div>
            </div>
            <button class="btn" onclick="login()">LOGIN</button>
            <div class="toggle-form">
                Don't have an account? <a onclick="showRegister()">Sign Up</a>
            </div>
            <div class="social-login">
                <div class="social-btn" >
                    <i class="fab fa-google"></i>
                </div>
                <div class="social-btn" >
                    <i class="fab fa-facebook-f"></i>
                </div>
                <div class="social-btn">
                    <i class="fab fa-apple"></i>
                </div>
            </div>
        </div>

        <div class="form-container" id="registerContainer">
            <div class="logo">
                <i class="fas fa-dumbbell pulse"></i>
                <h2>CREATE ACCOUNT</h2>
            </div>
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" id="regName" placeholder="Full Name" required>
                <div class="validation-message" id="regNameError"></div>
            </div>
            <div class="input-group">
                <i class="fas fa-at"></i>
                <input type="text" id="regUsername" placeholder="Username" required oninput="validateUsername()">
                <div class="validation-message" id="regUsernameError"></div>
            </div>
            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input type="email" id="regEmail" placeholder="Email" required oninput="validateEmailField('regEmail', 'regEmailError')">
                <div class="validation-message" id="regEmailError"></div>
            </div>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="regPassword" placeholder="Password" required oninput="checkPasswordStrength()">
                <div class="password-strength">
                    <div class="strength-bar" id="strengthBar"></div>
                </div>
                <div class="validation-message" id="regPasswordError"></div>
            </div>
            <div class="terms">
                <input type="checkbox" id="agreeTerms" required>
                <label for="agreeTerms">I agree to the Terms & Conditions</label>
                <div class="validation-message" id="termsError"></div>
            </div>
            <button class="btn" onclick="register()">SIGN UP</button>
            <div class="toggle-form">
                Already have an account? <a onclick="showLogin()">Sign In</a>
            </div>
        </div>
    </div>

    <script>
        // Initialize local storage for users if it doesn't exist
        if(!localStorage.getItem('gymUsers')) {
            localStorage.setItem('gymUsers', JSON.stringify([]));
        }
        
        // Generate bubbles for background
        function createBubbles() {
            const bubbles = document.querySelector('.bg-bubbles');
            for (let i = 0; i < 15; i++) {
                const li = document.createElement('li');
                li.style.left = Math.random() * 100 + '%';
                li.style.width = Math.random() * 100 + 20 + 'px';
                li.style.height = li.style.width;
                li.style.animationDelay = Math.random() * 20 + 's';
                li.style.animationDuration = Math.random() * 20 + 10 + 's';
                bubbles.appendChild(li);
            }
        }
        
        createBubbles();
        
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.innerHTML = type === 'success' 
                ? `<i class="fas fa-check-circle"></i> ${message}`
                : `<i class="fas fa-exclamation-circle"></i> ${message}`;
            toast.className = `toast ${type} show`;
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
        
        function showRegister() {
            document.getElementById("loginContainer").style.display = "none";
            document.getElementById("registerContainer").style.display = "block";
        }
        
        function showLogin() {
            document.getElementById("registerContainer").style.display = "none";
            document.getElementById("loginContainer").style.display = "block";
        }
        
        function validateUsername() {
            const username = document.getElementById("regUsername").value;
            const errorElement = document.getElementById("regUsernameError");
            
            if (username.length === 0) {
                errorElement.textContent = "";
                errorElement.classList.remove("show", "valid");
                return false;
            }
            
            // Username must be 4-20 chars, contain letters, numbers, and special chars
            const hasNumber = /[0-9]/.test(username);
            const hasSpecialChar = /[!@#$%^&*(),.?":{}|<>]/.test(username);
            const isValidLength = username.length >= 4 && username.length <= 20;
            
            if (!isValidLength) {
                errorElement.textContent = "Username must be 4-20 characters";
                errorElement.classList.add("show");
                errorElement.classList.remove("valid");
                return false;
            }
            
            if (!hasNumber || !hasSpecialChar) {
                errorElement.textContent = "Username must contain numbers and special chars";
                errorElement.classList.add("show");
                errorElement.classList.remove("valid");
                return false;
            }
            
            // Check if username already exists
            const users = JSON.parse(localStorage.getItem('gymUsers'));
            const usernameExists = users.some(user => user.username === username);
            
            if (usernameExists) {
                errorElement.textContent = "Username already exists";
                errorElement.classList.add("show");
                errorElement.classList.remove("valid");
                return false;
            }
            
            errorElement.textContent = "Username is valid!";
            errorElement.classList.add("show", "valid");
            return true;
        }
        
        function validateEmailField(fieldId, errorId) {
            const email = document.getElementById(fieldId).value;
            const errorElement = document.getElementById(errorId);
            
            if (email.length === 0) {
                errorElement.textContent = "";
                errorElement.classList.remove("show", "valid");
                return false;
            }
            
            const isValid = validateEmail(email);
            
            if (!isValid) {
                errorElement.textContent = "Please enter a valid email address";
                errorElement.classList.add("show");
                errorElement.classList.remove("valid");
                return false;
            }
            
            // For registration, check if email already exists
            if (fieldId === 'regEmail') {
                const users = JSON.parse(localStorage.getItem('gymUsers'));
                const emailExists = users.some(user => user.email === email);
                
                if (emailExists) {
                    errorElement.textContent = "Email already registered";
                    errorElement.classList.add("show");
                    errorElement.classList.remove("valid");
                    return false;
                }
            }
            
            errorElement.textContent = "Email is valid!";
            errorElement.classList.add("show", "valid");
            return true;
        }
        
        function checkPasswordStrength() {
            const password = document.getElementById("regPassword").value;
            const strengthBar = document.getElementById("strengthBar");
            const errorElement = document.getElementById("regPasswordError");
            let strength = 0;
            
            if (password.length === 0) {
                strengthBar.style.width = "0%";
                errorElement.textContent = "";
                errorElement.classList.remove("show", "valid");
                return false;
            }
            
            // Criteria
            const hasUpperCase = /[A-Z]/.test(password);
            const hasNumber = /[0-9]/.test(password);
            const hasSpecialChar = /[!@#$%^&*(),.?":{}|<>]/.test(password);
            const isValidLength = password.length >= 8;
            
            if (password.length > 0) strength += 20;
            if (isValidLength) strength += 20;
            if (hasUpperCase) strength += 20;
            if (hasNumber) strength += 20;
            if (hasSpecialChar) strength += 20;
            
            strengthBar.style.width = strength + '%';
            
            if (strength < 40) {
                strengthBar.style.background = '#ff4757';
                errorElement.textContent = "Password is weak";
                errorElement.classList.add("show");
                errorElement.classList.remove("valid");
            } else if (strength < 80) {
                strengthBar.style.background = '#ffa502';
                errorElement.textContent = "Password is moderate";
                errorElement.classList.add("show");
                errorElement.classList.remove("valid");
            } else {
                strengthBar.style.background = '#2ed573';
                errorElement.textContent = "Password is strong!";
                errorElement.classList.add("show", "valid");
            }
            
            return strength >= 80;
        }
        
        function validateEmail(email) {
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return re.test(email);
        }
        
        function login() {
            let email = document.getElementById("loginEmail").value;
            let password = document.getElementById("loginPassword").value;
            let isValid = true;
            
            // Validate email
            if (!validateEmail(email)) {
                document.getElementById("loginEmailError").textContent = "Please enter a valid email address";
                document.getElementById("loginEmailError").classList.add("show");
                isValid = false;
            } else {
                document.getElementById("loginEmailError").classList.remove("show");
            }
            
            // Validate password
            if (password === "") {
                document.getElementById("loginPasswordError").textContent = "Please enter your password";
                document.getElementById("loginPasswordError").classList.add("show");
                isValid = false;
            } else {
                document.getElementById("loginPasswordError").classList.remove("show");
            }
            
            if (!isValid) {
                showToast("Please fix the errors to continue", "error");
                return;
            }
            
            // Check credentials against localStorage
            const users = JSON.parse(localStorage.getItem('gymUsers'));
            const user = users.find(u => u.email === email && u.password === password);
            
            if (!user) {
                showToast("Invalid email or password", "error");
                return;
            }
            
            // Simulate loading
            const btn = document.querySelector('#loginContainer .btn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> LOGGING IN...';
            btn.disabled = true;
            
            setTimeout(() => {
                btn.innerHTML = 'LOGIN';
                btn.disabled = false;
                
                // Store current user in session
                sessionStorage.setItem('currentUser', JSON.stringify(user));
                
                showToast(`Login successful! Welcome back, ${user.name}`);
                
                // Redirect to next page
                window.location.href = "page2/Main2.html";
            }, 1500);
        }
        
        function register() {
            let name = document.getElementById("regName").value;
            let username = document.getElementById("regUsername").value;
            let email = document.getElementById("regEmail").value;
            let password = document.getElementById("regPassword").value;
            let terms = document.getElementById("agreeTerms").checked;
            let isValid = true;
            
            // Validate name
            if (name === "") {
                document.getElementById("regNameError").textContent = "Please enter your full name";
                document.getElementById("regNameError").classList.add("show");
                isValid = false;
            } else {
                document.getElementById("regNameError").classList.remove("show");
            }
            
            // Validate username
            if (!validateUsername()) {
                isValid = false;
            }
            
            // Validate email
            if (!validateEmailField('regEmail', 'regEmailError')) {
                isValid = false;
            }
            
            // Validate password
            if (!checkPasswordStrength()) {
                isValid = false;
            }
            
            // Validate terms
            if (!terms) {
                document.getElementById("termsError").textContent = "You must agree to the terms and conditions";
                document.getElementById("termsError").classList.add("show");
                isValid = false;
            } else {
                document.getElementById("termsError").classList.remove("show");
            }
            
            if (!isValid) {
                showToast("Please fix the errors to continue", "error");
                return;
            }
            
            // Simulate loading
            const btn = document.querySelector('#registerContainer .btn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> CREATING ACCOUNT...';
            btn.disabled = true;
            
            // Create new user object
            const newUser = {
                id: Date.now().toString(),
                name: name,
                username: username,
                email: email,
                password: password,
                joinDate: new Date().toISOString()
            };
            
            // Add user to localStorage
            setTimeout(() => {
                const users = JSON.parse(localStorage.getItem('gymUsers'));
                users.push(newUser);
                localStorage.setItem('gymUsers', JSON.stringify(users));
                
                btn.innerHTML = 'SIGN UP';
                btn.disabled = false;
                
                // Automatically log in the user after registration
                sessionStorage.setItem('currentUser', JSON.stringify(newUser));
                
                // Show success message and redirect
                showToast("Registration successful! Redirecting...");
                
                // Clear registration form
                document.getElementById("regName").value = "";
                document.getElementById("regUsername").value = "";
                document.getElementById("regEmail").value = "";
                document.getElementById("regPassword").value = "";
                document.getElementById("agreeTerms").checked = false;
                document.getElementById("strengthBar").style.width = "0%";
                
                // Clear validation messages
                document.querySelectorAll('.validation-message').forEach(el => {
                    el.classList.remove("show", "valid");
                });
                
                // Redirect to next page after a short delay
                setTimeout(() => {
                    window.location.href = "page2/Main2.html";
                }, 1500);
                
            }, 1500);
        }
        
        function socialLogin(provider) {
            showToast(`Social login with ${provider.charAt(0).toUpperCase() + provider.slice(1)} is not implemented in this demo`);
            // In a real app, this would redirect to OAuth login
        }
        
        // Check if there are any registered users
        window.onload = function() {
            const users = JSON.parse(localStorage.getItem('gymUsers'));
            if (users.length > 0) {
                console.log(`${users.length} users found in local storage`);
            } else {
                console.log('No registered users found');
            }
            
            // Check if user is already logged in
            if(sessionStorage.getItem('currentUser')) {
                window.location.href = "page2/Main2.html";
            }
        }
