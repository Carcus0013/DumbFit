<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fitness Goal Calculator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
        background: linear-gradient(to bottom right, #86940d, #c0a21c);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      padding: 20px;
    }

    .container {
      border: 3px solid #FFD700;
      border-radius: 20px;
      padding: 40px;
      background-color: #111;
      width: 90%;
      max-width: 600px;
      box-shadow: 0 0 20px #FFD70055;
    }

    h1 {
      color: #FFD700;
      margin-bottom: 20px;
    }

    .btn {
      background-color: #FFD700;
      color: #000;
      padding: 12px 25px;
      border: none;
      border-radius: 25px;
      margin: 10px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      background-color: #fff;
      color: #000;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 10px;
      border: 2px solid #FFD700;
      background: #222;
      color: #FFD700;
      font-size: 16px;
    }

    .result-box {
      margin-top: 20px;
      padding: 20px;
      background-color: #222;
      border: 2px solid #FFD700;
      border-radius: 15px;
    }

    .warning {
      color: #ff4444;
      margin-top: 10px;
    }

    /* Home button styles */
    .nav-buttons {
      margin-top: 20px;
    }

    .home-btn {
      background-color: #FFD700;
      color: #000;
      font-weight: bold;
      border: 2px solid #fff;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 25px;
      box-shadow: 0 0 10px #fff, 0 0 20px #FFD700;
      transition: all 0.3s ease;
      display: inline-block;
    }

    .home-btn:hover {
      background-color: #fff;
      color: #000;
      box-shadow: 0 0 20px #fff, 0 0 30px #FFD700;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Fitness Goal Calculator</h1>

    <div id="step1">
      <p>Select your goal:</p>
      <button class="btn" onclick="nextStep('lose')">Lose Weight</button>
      <button class="btn" onclick="nextStep('maintain')">Maintain Weight</button>
      <button class="btn" onclick="nextStep('gain')">Gain Weight</button>
    </div>

    <div id="step2" style="display:none">
      <p>Select activity level:</p>
      <button class="btn" onclick="nextStep2('low')">Low</button>
      <button class="btn" onclick="nextStep2('moderate')">Moderate</button>
      <button class="btn" onclick="nextStep2('high')">High</button>
    </div>

    <div id="step3" style="display:none">
      <input type="number" id="height" placeholder="Height (cm)" />
      <input type="number" id="weight" placeholder="Weight (kg)" />
      <input type="number" id="goalWeight" placeholder="Goal Weight (kg)" />
      <button class="btn" onclick="calculate()">Calculate</button>
      <div class="warning" id="warningMsg"></div>
    </div>

    <div class="result-box" id="result" style="display:none">
      <h2>Results</h2>
      <p id="calories"></p>
      <p id="bmi"></p>
      <p id="summary"></p>
      <div class="nav-buttons">
        <a href="Tracker.html" class="home-btn">🏠 Home</a>
      </div>
    </div>

  </div>

  <script>
    let goal = "";
    let activity = "";

    function nextStep(selectedGoal) {
      goal = selectedGoal;
      document.getElementById('step1').style.display = 'none';
      document.getElementById('step2').style.display = 'block';
    }

    function nextStep2(selectedActivity) {
      activity = selectedActivity;
      document.getElementById('step2').style.display = 'none';
      document.getElementById('step3').style.display = 'block';
    }

    function calculate() {
      const height = parseFloat(document.getElementById('height').value);
      const weight = parseFloat(document.getElementById('weight').value);
      const goalWeight = parseFloat(document.getElementById('goalWeight').value);
      const msg = document.getElementById('warningMsg');
      const res = document.getElementById('result');

      msg.textContent = '';
      res.style.display = 'none';

      if (!height || !weight || !goalWeight) {
        msg.textContent = 'Please fill all fields correctly.';
        return;
      }

      if ((goal === 'lose' && goalWeight >= weight) ||
          (goal === 'gain' && goalWeight <= weight) ||
          (goal === 'maintain' && goalWeight !== weight)) {
        msg.textContent = 'Check if your goal weight is valid for your goal.';
        return;
      }

      const bmr = 10 * weight + 6.25 * height - 5 * 25 + 5;
      const multiplier = activity === 'moderate' ? 1.55 : activity === 'high' ? 1.9 : 1.2;
      let calories = bmr * multiplier;
      if (goal === 'lose') calories -= 500;
      if (goal === 'gain') calories += 500;

      const bmi = (weight / ((height / 100) ** 2)).toFixed(1);

      document.getElementById('calories').innerText = `Calories needed: ${Math.round(calories)} kcal/day`;
      document.getElementById('bmi').innerText = `Your BMI: ${bmi}`;
      document.getElementById('summary').innerText = `Goal: ${goal.toUpperCase()}, Activity: ${activity.toUpperCase()}`;

      res.style.display = 'block';
    }
  </script>
</body>
</html>
